[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/studio"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/dream"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/horizon"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/phosphor"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/obsidian"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/keys"
  to = "/"
  status = 302
[[redirects]]
  from = "/password"
  to = "/"
  status = 302
